<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110D" />
    <title>Pedido 3D — Menú AR</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var isAdmin = path.indexOf('/admin') === 0 || path.indexOf('/cocina') === 0 || path.indexOf('/llamados') === 0;
        var key = isAdmin ? 'admin' : 'client';
        var themes = { client: 'dark', admin: 'dark' };
        try {
          var raw = localStorage.getItem('pedido3d_themes');
          if (raw) themes = JSON.parse(raw);
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', themes[key] || 'dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
