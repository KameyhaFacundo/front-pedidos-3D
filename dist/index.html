    <script>
      (function() {
        var path = window.location.pathname;
        var isAdmin = /^\/(?:[^\/]+\/)?(?:admin|cocina|llamados)/.test(path);
        var key = isAdmin ? 'admin' : 'client';
        var themes = { client: 'dark', admin: 'dark' };
        try {
          var raw = localStorage.getItem('pidevo_themes') || localStorage.getItem('pedido3d_themes');
          if (raw) themes = JSON.parse(raw);
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', themes[key] || 'dark');
      })();
    </script>
